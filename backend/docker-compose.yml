version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: asatech-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: asatech
      MONGO_INITDB_ROOT_PASSWORD: asatech_secure_password_change_me
      MONGO_INITDB_DATABASE: asatech
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - asatech-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asatech-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      MONGODB_URI: mongodb://asatech:asatech_secure_password_change_me@mongodb:27017/asatech?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@asatech.ng}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-ASATECH}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@asatech.ng}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - asatech-network
    volumes:
      - ./logs:/app/logs

volumes:
  mongodb_data:

networks:
  asatech-network:
    driver: bridge
